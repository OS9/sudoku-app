<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="description" content="オフラインで遊べる数独">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css">
  <title>Sudoku — 数独</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">FOCUS · LOGIC · CALM</div>
        <h1>数独<span>Sudoku</span></h1>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="テーマ切替" title="テーマ切替">☼</button>
    </header>

    <section class="toolbar panel">
      <label class="difficulty-wrap">難易度
        <select id="difficulty" aria-label="難易度">
          <option value="easy">初級</option>
          <option value="medium" selected>中級</option>
          <option value="hard">上級</option>
        </select>
      </label>
      <button id="newGame" class="primary">新しい問題 <span>↻</span></button>
    </section>

    <section class="stats">
      <div class="stat panel"><span>TIME</span><strong id="timer">00:00</strong></div>
      <div class="stat panel"><span>MISTAKES</span><strong id="mistakes">0</strong></div>
      <div class="stat panel"><span>BEST · <b id="bestLabel">中級</b></span><strong id="best">--:--</strong></div>
    </section>

    <section class="board-wrap panel">
      <div id="board" class="board" role="grid" aria-label="数独盤面"></div>
      <div class="board-footer">
        <span id="progress">入力済み 0 / 81</span>
        <span id="message" aria-live="polite">マスを選んで数字を入力</span>
      </div>
    </section>

    <section class="number-pad" aria-label="数字入力">
      <div class="digits" id="digits"></div>
      <div class="tools">
        <button id="notesBtn" class="tool-btn" aria-pressed="false">✎ <span>メモ</span></button>
        <button id="undoBtn" class="tool-btn">↶ <span>戻す</span></button>
        <button id="eraseBtn" class="tool-btn">⌫ <span>消去</span></button>
        <button id="hintBtn" class="tool-btn accent">✦ <span>ヒント</span></button>
      </div>
    </section>

    <section class="bottom-info panel">
      <div class="record-icon">✧</div>
      <div><strong>自分のペースで解こう</strong><p>進行状況はこの端末に自動保存されます。</p></div>
      <button id="recordsBtn" class="text-btn">記録を見る</button>
    </section>
    <footer>オフライン対応 · データは端末内に保存</footer>
  </main>

  <dialog id="recordsDialog">
    <div class="dialog-head"><h2>クリア記録</h2><button class="icon-btn" id="closeRecords" aria-label="閉じる">×</button></div>
    <div id="recordsContent"></div>
    <button id="clearRecords" class="danger-btn">クリア記録を削除</button>
  </dialog>
  <dialog id="confirmDialog">
    <h2>新しい問題を始めますか？</h2>
    <p>現在の問題の進行状況は上書きされます。</p>
    <div class="dialog-actions"><button id="cancelNew" class="secondary">キャンセル</button><button id="confirmNew" class="primary">新しく始める</button></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
